name: Moodle Plugin CI (Static Analysis)

# Workflow ini akan berjalan otomatis setiap kali ada Push atau Pull Request
on: [push, pull_request]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']
        moodle-branch: ['MOODLE_401_STABLE'] 

    steps:
      - name: 1. Checkout kode plugin
        uses: actions/checkout@v3
        with:
          path: plugin

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, gd, intl, xmlrpc, soap, zip, curl, sodium
          coverage: none

      - name: 3. Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^3
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH

      - name: 4. Setup & Start MySQL
        run: |
          sudo systemctl start mysql.service
          # Memastikan lingkungan bersih untuk mencegah error "database exists"
          mysql -uroot -proot -e "DROP DATABASE IF EXISTS moodle;"

      - name: 5. Install Core Moodle & Inject Plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-user=root --db-pass=root
        env:
          DB: mysqli
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          
      # --- BAGIAN STATIC ANALYSIS & PENGECEKAN KODING ---

      - name: 6. PHP Lint (Mengecek Syntax Error fatal)
        run: moodle-plugin-ci phplint

      - name: 7. Validate Plugin (Mengecek struktur, version.php, dll)
        run: moodle-plugin-ci validate

      - name: 8. Moodle Codechecker (Standar Koding Moodle)
        run: moodle-plugin-ci codechecker

      - name: 9. PHP Copy/Paste Detector (Mengecek blok kode duplikat)
        run: moodle-plugin-ci phpcpd

      - name: 10. PHP Mess Detector (Mengecek unused variable & ukuran fungsi)
        run: moodle-plugin-ci phpmd

      - name: 11. Mustache Lint (Jika ada file UI .mustache)
        run: moodle-plugin-ci mustache
        continue-on-error: true # Dibiarkan error tidak menggagalkan workflow jika tidak ada mustache
